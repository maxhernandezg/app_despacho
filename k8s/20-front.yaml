# ============================================================
# FRONTEND (React + nginx, puerto 80)
# - Deployment: corre la imagen desde ECR (nginx sirve el build y
#   hace de reverse proxy hacia venta-service / despacho-service)
# - Service type LoadBalancer: AWS crea un balanceador con URL pública (IE2)
# - HPA: autoscaling por CPU al 50%
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
  namespace: innovatech
  labels:
    app: front
spec:
  replicas: 2                 # una replica por zona de disponibilidad (alta disponibilidad)
  # maxSurge 0 = borra un pod viejo antes de crear el nuevo -> mantiene el balance
  # entre zonas en cada rolling update (no rompe el topologySpread).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      # Obliga a repartir las replicas entre las 2 zonas: si cae una AZ, la otra sigue sirviendo.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: front
      containers:
        - name: front
          # El pipeline reemplaza el tag :latest por el SHA del commit en cada deploy.
          image: 456597982359.dkr.ecr.us-east-1.amazonaws.com/front-despacho:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: front-service
  namespace: innovatech
  labels:
    app: front
spec:
  type: LoadBalancer          # AWS provisiona un Load Balancer con DNS público
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: front-hpa
  namespace: innovatech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: front
  minReplicas: 2               # nunca baja de 2: siempre una replica viva por zona
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
